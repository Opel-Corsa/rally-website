<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Website Demo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fdf6e3; color: #333; margin: 0; padding: 0; }
        header { background-color: #00274d; color: #ffd700; padding: 20px; text-align: center; }
        nav a { color: #ffd700; margin: 0 10px; text-decoration: none; font-weight: bold; }
        .container { padding: 20px; }
        .season, .rally { margin-bottom: 40px; }
        h2 { border-bottom: 2px solid #00274d; padding-bottom: 5px; }
        .photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .photos img { width: 200px; height: 150px; object-fit: cover; border: 2px solid #00274d; }
        .video iframe { width: 560px; height: 315px; max-width: 100%; border: none; margin-top: 10px; }
        footer { text-align: center; padding: 20px; background-color: #00274d; color: #ffd700; }
    </style>
</head>
<body>

<header>
    <h1>Rally Website Demo</h1>
    <nav>
        <a href="#season2025">Seizoen 2025</a>
    </nav>
</header>

<div class="container">
    <section class="season" id="season2025">
        <h2>Seizoen 2025</h2>
        
        <!-- Rally 1 -->
        <div class="rally">
            <h3>B-short Solre-Saint-Gery (20–21 juli)</h3>
            <p><strong>Interview:</strong> Dit is een voorbeeldinterviewtekst voor B-short Solre-Saint-Gery.</p>
            <div class="photos">
                <img src="https://via.placeholder.com/200x150?text=Foto+1" alt="Foto 1">
                <img src="https://via.placeholder.com/200x150?text=Foto+2" alt="Foto 2">
                <img src="https://via.placeholder.com/200x150?text=Foto+3" alt="Foto 3">
            </div>
            <div class="video">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Rally 2 -->
        <div class="rally">
            <h3>B-short Momignies (13–14 september)</h3>
            <p><strong>Interview:</strong> Dit is een voorbeeldinterviewtekst voor B-short Momignies.</p>
            <div class="photos">
                <img src="https://via.placeholder.com/200x150?text=Foto+1" alt="Foto 1">
                <img src="https://via.placeholder.com/200x150?text=Foto+2" alt="Foto 2">
                <img src="https://via.placeholder.com/200x150?text=Foto+3" alt="Foto 3">
            </div>
            <div class="video">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
        </div>
    </section>
</div>

<footer>
    &copy; 2025 Rally Website Demo
</footer>

</body>
</html>
